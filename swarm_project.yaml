name: Energy-Efficient Flocking Hardware Deployment

version: 1.0

# This file MUST live at the repo root, not inside ants26_replication/hardware_deployment/
# where it originally sat. There are TWO independent consumers of this file, and only one
# of them tolerates nesting:
#   - Pi-side (swarm_platform/projects/loader.py + manager.py, run by the daemon):
#     rglob()s the whole clone for a file with this name, then moves only ITS PARENT
#     directory into place as the active project -- nesting is fine here.
#   - Controller-side (swarm_platform/controller/project.py's Project.load_config(),
#     used by SwarmSession.start() to read experiment_config()/tracking): does a plain
#     `git clone` and hardcodes the path `<local_clone>/swarm_project.yaml` -- NO
#     recursive search. This raises FileNotFoundError if the file isn't at repo root,
#     which is what happens if you move it back into a subdirectory.
# Consequence: the Pi-side clone now keeps the WHOLE repository as the active project
# (project_root == repo root, not just ants26_replication/hardware_deployment/), so every
# experiment's `class:` path below is a dotted path from the repo root, e.g.
# `ants26_replication.hardware_deployment.hebbian_swarm_experiment.HebbianSwarmExperiment`
# -- and the genome .npy could in principle be referenced from its original location in
# ../hebbian_results_v2/ again. It still lives flat in hardware_deployment/ (a copy) for
# robustness (see hebbian_swarm_experiment.py's _resolve_genome_path()) and because
# ants26_replication/ has other large, unrelated result directories that have no business
# being read by the controller class.
#
# Also note: rglob("swarm_project.yaml") requires there to be EXACTLY ONE file with this
# name anywhere in the whole repository -- don't add another one elsewhere.

tracking:
  host: 10.0.10.4
  # Same OptiTrack host and rigid-body mappings as thymio_raspberry_swarm_control's own
  # swarm_project.yaml (that repo is NOT touched or depended on by this deployment --
  # these are just facts about the physical rig, copied here because each project's
  # swarm_project.yaml supplies its own tracking config independently; see
  # swarm_platform.controller.client.SwarmClient.start_tracking()). Only the 3 hosts this
  # trial actually uses are listed -- add more here if you change HOSTS in the launcher.
  hostname_map:
    thymio-01: "RigidBody 57"
    thymio-03: "RigidBody 50"
    thymio-04: "RigidBody 56"
    thymio-09: "RigidBody 54"
    thymio-07: "RigidBody 55"
    thymio-14: "RigidBody 19"
    thymio-15: "RigidBody 42"
    thymio-11: "RigidBody 33"
    thymio-12: "RigidBody 30"
    thymio-25: "RigidBody 21"
    thymio-18: "RigidBody 31"
    thymio-08: "RigidBody 45"
    thymio-17: "RigidBody 34"
    thymio-16: "RigidBody 36"
    thymio-19: "RigidBody 46"


experiments:
  hebbian_swarm:
    class: ants26_replication.hardware_deployment.hebbian_swarm_experiment.HebbianSwarmExperiment
    tracking: true   # required -- this is what makes the platform push OptiTrack poses at all
  calibrate_speed:
    class: ants26_replication.hardware_deployment.diagnostics.calibrate_speed_experiment.CalibrateSpeedExperiment
    tracking: true
  calibrate_position_heading:
    class: ants26_replication.hardware_deployment.diagnostics.calibrate_position_heading_experiment.CalibratePositionHeadingExperiment
    tracking: true
  print_poses:
    class: ants26_replication.hardware_deployment.diagnostics.print_poses_experiment.PrintPosesExperiment
    tracking: true
