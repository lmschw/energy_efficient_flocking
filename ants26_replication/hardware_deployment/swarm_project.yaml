name: Energy-Efficient Flocking Hardware Deployment

version: 1.0

# thymio_swarm_platform's ProjectManager clones the WHOLE repository given to
# client.project(repository=...), but only moves THIS FILE's own parent directory
# (ants26_replication/hardware_deployment/) into place as the active project on each Pi
# -- everything else in the repo (experiment/, hebbian_results_v2/, etc.) is discarded
# after the clone. That's why the genome .npy lives flat in this directory (a copy of
# ../hebbian_results_v2/hebbian_save_battery_avoid_all_best.npy) instead of being
# referenced from its original location, and why every experiment's `class:` path below
# is relative to this directory, not the repo root.
#
# Also note: rglob("swarm_project.yaml") requires there to be EXACTLY ONE file with this
# name anywhere in the whole repository -- don't add another one elsewhere.

tracking:
  host: 10.0.10.4
  # Same OptiTrack host and rigid-body mappings as thymio_raspberry_swarm_control's own
  # swarm_project.yaml (that repo is NOT touched or depended on by this deployment --
  # these are just facts about the physical rig, copied here because each project's
  # swarm_project.yaml supplies its own tracking config independently; see
  # swarm_platform.controller.client.SwarmClient.start_tracking()). Only the 3 hosts this
  # trial actually uses are listed -- add more here if you change HOSTS in the launcher.
  hostname_map:
    thymio-15: "RigidBody 19"
    thymio-16: "RigidBody 15"
    thymio-17: "RigidBody 20"

experiments:
  hebbian_swarm:
    class: hebbian_swarm_experiment.HebbianSwarmExperiment
    tracking: true   # required -- this is what makes the platform push OptiTrack poses at all
  calibrate_speed:
    class: diagnostics.calibrate_speed_experiment.CalibrateSpeedExperiment
    tracking: true
  print_poses:
    class: diagnostics.print_poses_experiment.PrintPosesExperiment
    tracking: true
